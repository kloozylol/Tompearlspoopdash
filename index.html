<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tom Pearl's Poop Dash</title>
<style>
:root{--bg:#2b1a10;--ink:#fff3d6;--acc:#ffb627;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:100%;max-height:100%;aspect-ratio:16/9}
canvas#c{width:100%;height:100%;display:block;background:#000}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(30,15,5,.82);text-align:center;padding:10px;overflow:auto}
.ov.on{display:flex}#menu{background:rgba(30,15,5,.4)}#end{justify-content:flex-end;background:linear-gradient(transparent 30%,rgba(30,15,5,.9))}
h1{margin:0;font-size:clamp(26px,7vw,60px);line-height:1;color:var(--acc);text-shadow:0 4px 0 #6b3a14;transform:rotate(-2deg)}
h2{margin:0;font-size:clamp(20px,4vw,34px);color:var(--acc)}p{margin:0;font-size:clamp(12px,2.2vw,18px)}
.b,.up{font:bold clamp(14px,2.6vw,20px) inherit;font-family:inherit;padding:8px 20px;border-radius:12px;border:3px solid #6b3a14;background:var(--acc);color:#3d1f08;cursor:pointer;min-width:180px}
.b:focus-visible,.sw:focus-visible,.sh:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff3d655;cursor:pointer}.sw.sel,.sh.sel{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}
.sh{padding:6px 14px;border-radius:10px;border:3px solid #fff3d655;background:#4a2c17;color:var(--ink);font-family:inherit;font-weight:bold;cursor:pointer}
#pb{position:absolute;top:8px;right:8px;display:none;width:44px;height:44px;border-radius:12px;border:3px solid #6b3a14;background:var(--acc);font-size:20px;cursor:pointer}
#pb.on{display:block}
</style></head><body><div id="wrap"><div id="box">
<canvas id="c" width="960" height="540" aria-label="Poop Dash game"></canvas>
<button id="pb" aria-label="Pause">⏸</button>
<div class="ov on" id="menu"><h1>Tom Pearl's<br>Poop Dash</h1><p>Cube, ship and wave your way to the porcelain throne.</p>
<button class="b" id="bPlay">Play</button><button class="b" id="bCust">Customize poop</button><button class="b" id="bCh">Cheats</button>
<label class="up b">Add Tom Pearl photos<input id="file" type="file" accept="image/*" multiple hidden></label><p id="pc">Default Tom Pearl photo loaded. Add more if you like.</p></div>
<div class="ov" id="lv"><h2>Pick a level</h2><div id="lvl" class="row"></div><button class="b" data-menu>Back</button></div>
<div class="ov" id="cust"><h2>Customize</h2><canvas id="pv" width="120" height="120"></canvas><div id="cols" class="row"></div><div id="shps" class="row"></div><button class="b" data-menu>Done</button></div>
<div class="ov" id="pause"><h2>Paused</h2><button class="b" id="bRes">Resume</button><button class="b" id="bRe">Restart</button><button class="b" id="bCh2">Cheats</button><button class="b" data-menu>Quit to menu</button></div>
<div class="ov" id="cheat"><h2>Cheat menu</h2><div id="chl" class="row" style="flex-direction:column;align-items:center"></div><button class="b" id="bChD">Done</button></div>
<div class="ov" id="end"><h2 id="e1"></h2><p id="e2"></p><div class="row"><button class="b" id="bRetry">Retry</button><button class="b" id="bNext">Next level</button><button class="b" data-menu>Menu</button></div></div>
</div></div>

function save(){try{localStorage.setItem('tpd',JSON.stringify({cfg:cfg,best:best}))}catch(e){}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function ov(id){document.querySelectorAll('.ov').forEach(function(o){o.classList.toggle('on',o.id===id)});$('pb').classList.toggle('on',st==='play'||st==='intro')}
function goMenu(){st='menu';ov('menu')}
document.querySelectorAll('[data-menu]').forEach(function(b){b.onclick=goMenu});
$('bPlay').onclick=function(){buildLv();ov('lv')};$('bCust').onclick=function(){st='menu';drawPv();ov('cust')};
$('bRes').onclick=function(){st='play';ov('')};$('bRe').onclick=function(){start(li)};$('bRetry').onclick=function(){start(li)};
$('bNext').onclick=function(){start(li+1)};$('pb').onclick=function(e){e.stopPropagation();pause()};
function pause(){if(st==='play'){st='paused';ov('pause')}else if(st==='paused'){st='play';ov('')}}
function buildLv(){var d=$('lvl');d.innerHTML='';LV.forEach(function(L,i){var b=document.createElement('button');b.className='b';b.textContent=(i+1)+'. '+L.n+' ('+(best[i]||0)+'%)';b.onclick=function(){start(i)};d.appendChild(b)})}
function buildCust(){var c=$('cols'),h=$('shps');COLORS.forEach(function(k,i){var b=document.createElement('button');b.className='sw';b.setAttribute('aria-label',k[0]);b.style.background=i===6?'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)':k[1];b.onclick=function(){cfg.color=i;save();drawPv()};c.appendChild(b)});
SHAPES.forEach(function(k,i){var b=document.createElement('button');b.className='sh';b.textContent=k;b.onclick=function(){cfg.shape=i;save();drawPv()};h.appendChild(b)})}
function drawPv(){var c=$('pv').getContext('2d');c.clearRect(0,0,120,120);icon(c,26,26,68,0,1);
document.querySelectorAll('.sw').forEach(function(b,i){b.classList.toggle('sel',i===cfg.color)});document.querySelectorAll('.sh').forEach(function(b,i){b.classList.toggle('sel',i===cfg.shape)})}
$('file').onchange=function(e){Array.prototype.slice.call(e.target.files,0,8).forEach(function(f){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){pics.push(im);$('pc').textContent=pics.length+' Tom Pearl photo'+(pics.length>1?'s':'')+' loaded (kept until you close the page)'};im.src=r.result};r.readAsDataURL(f)})};
function rr(c,x,y,w,h,r){r=r==null?Math.min(10,h/2):r;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();c.stroke()}
function pcol(){return cfg.color===6?'hsl('+(t*120%360)+',75%,50%)':COLORS[cfg.color][1]}
function icon(c,x,y,s,rot,face){c.save();c.translate(x+s/2,y+s/2);c.rotate(rot);c.translate(-s/2,-s/2);
c.fillStyle=pcol();c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=3;c.lineJoin='round';var sh=cfg.shape;
if(sh===0){rr(c,0,s*.62,s,s*.38);rr(c,s*.1,s*.32,s*.8,s*.34);rr(c,s*.25,s*.08,s*.5,s*.28);c.beginPath();c.moveTo(s*.42,s*.1);c.quadraticCurveTo(s*.55,-s*.12,s*.62,s*.08);c.fill();c.stroke()}
